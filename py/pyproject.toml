[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cfarewell"
version = "0.3.0"
description = "Deterministic locale-correct valedictions for formal correspondence"
readme = "README.md"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
license-files = ["LICENSES/*"]
requires-python = ">=3.10"
keywords = ["i18n", "correspondence", "locale"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]


[project.urls]
Homepage = "https://github.com/corbet-labs/cfarewell#readme"
Repository = "https://github.com/corbet-labs/cfarewell"
Issues = "https://github.com/corbet-labs/cfarewell/issues"

[project.scripts]
cfarewell = "cfarewell.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["cfarewell"]
